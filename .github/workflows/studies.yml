name: Validate community studies
on:
  workflow_run:
    workflows: ['Check Easy benchmark']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to regrade
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  regrade:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read submitted JSON and regrade with the base grader
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          STATUS_CONTEXT: Easy study regrade
        run: /usr/bin/python3 scripts/validate_study_pr.py
