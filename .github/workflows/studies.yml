name: Validate community studies
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  regrade:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Read submitted JSON and regrade with the base grader
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: /usr/bin/python3 scripts/validate_study_pr.py
