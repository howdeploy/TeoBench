name: Update Easy statistics
on:
  push:
    branches: [main]
    paths:
      - 'Easy-Bench/studies/**'
      - 'teobench/**'
      - '.github/workflows/statistics.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: easy-statistics
  cancel-in-progress: false
jobs:
  statistics:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Regrade latest accepted studies and commit statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # This is the disposable CI checkout. Always use the latest main;
            # another accepted PR may have landed while the job was queued.
            git fetch origin main
            git reset --hard origin/main
            /usr/bin/python3 -m teobench stats --output Easy-Bench/statistics/summary.json
            git add Easy-Bench/statistics/summary.json Easy-Bench/statistics/summary.csv
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Update Easy-Bench community statistics'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
